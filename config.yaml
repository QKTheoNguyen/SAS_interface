# SAS_interface runtime configuration.
#
# run.sh starts every worker whose URL points at 127.0.0.1/localhost.
# A worker with any other host is assumed to be already running there
# (for example on a GPU node), and the gateway just connects to it.
# Comment a worker out to disable all of its models.

gateway:
  host: 127.0.0.1        # 0.0.0.0 exposes the page to the whole network (see README_perso.md)
  port: 8000
  max_input_seconds: 60  # longest source / target clip accepted
  max_stream_seconds: 300  # a live stream stops automatically after this

workers:
  quickconvert:          # ASR-BN, kNN-VC (torch 2.6)
    url: http://127.0.0.1:8101
  streamvoiceanon:       # StreamVoiceAnon (torch 2.4, needs a CUDA GPU)
    url: http://127.0.0.1:8102
  tvtsyn:                # TVTSyn (torch 2.8, CPU or GPU)
    url: http://127.0.0.1:8105
  vpc:                   # VoicePrivacy Challenge 2026 baselines: ASR-BN (VPC), McAdams, SSL BM1, NAC (torch 2.8)
    url: http://127.0.0.1:8104
  metrics:               # metrics panel: speaker encoders + SER from quick-convert
    url: http://127.0.0.1:8103
