[project]
name = "sas-worker-tvtsyn"
version = "0.1.0"
description = "Worker environment for TVTSyn (torch 2.8, speechbrain 1.1)"
requires-python = ">=3.11,<3.12"
# TVTSyn's `pytorch` and `speaker` extras. Not in the vpc worker: that one pins speechbrain 1.0.3.
dependencies = [
    "sas-worker",
    "tvtsyn[pytorch,speaker]",
    "torch==2.8.0",
    "torchaudio==2.8.0",
]

[tool.uv]
package = false

[tool.uv.sources]
tvtsyn = { path = "../../third_party/TVTSyn", editable = true }
sas-worker = { path = "../common", editable = true }
